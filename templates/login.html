{% extends "base.html" %}
{% block content %}
<div class="section" style="max-width:560px;margin:0 auto;">
  <h2 style="margin:0 0 8px;">Company Login</h2>
  <div class="small-muted">Login to access enterprise portals (Admin / IT / Staff).</div>

  <div class="glass-card" style="margin-top:18px;">
    <div class="right-pane">
      <form method="POST">
        <label class="form-label">Company Username</label>
        <input class="input" name="company_username" placeholder="company123" required>

        <label class="form-label">Password</label>
        <input class="input" type="password" name="company_password" required>

        <button class="btn btn-primary" style="width:100%;margin-top:16px;padding:12px 14px;">
          Login →
        </button>
      </form>

      <div style="margin-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">
        <a class="btn" href="{{ url_for('register_company') }}">Register Company</a>
        <a class="btn btn-ghost" href="{{ url_for('home') }}">Back Home</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
