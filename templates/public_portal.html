{% extends "base.html" %}
{% block content %}
<div class="section" style="max-width:720px;margin:0 auto;">
  <h2 style="margin:0 0 8px;">Public Send/Receive</h2>
  <div class="small-muted">No company login needed.</div>

  <div class="glass-card" style="margin-top:18px;">
    <div class="right-pane">
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <a class="btn btn-primary" href="{{ url_for('public_send') }}">Send a file</a>
        <a class="btn" href="{{ url_for('public_receive') }}">Receive a file</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
