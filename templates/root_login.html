{% extends "base.html" %}
{% block content %}
<div class="section" style="max-width:540px;margin:0 auto;">
  <h2 style="margin:0 0 8px;">Developer / Root Login</h2>
  <div class="small-muted">System-wide monitoring dashboard.</div>

  <div class="glass-card" style="margin-top:18px;">
    <div class="right-pane">
      <form method="POST">
        <label class="form-label">Username</label>
        <input class="input" name="username" required>

        <label class="form-label">Password</label>
        <input class="input" type="password" name="password" required>

        <button class="btn btn-primary" style="width:100%;margin-top:16px;padding:12px 14px;">
          Login →
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
