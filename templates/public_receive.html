{% extends "base.html" %}
{% block content %}
<div class="section" style="max-width:780px;margin:0 auto;">
  <h2 style="margin:0 0 8px;">Public Receive</h2>
  <div class="small-muted">Enter the 6-digit code to unlock the file.</div>

  <div class="glass-card" style="margin-top:18px;">
    <div class="right-pane">
      <form method="POST">
        <label class="form-label">Receive code</label>
        <input class="input" name="code" placeholder="123456" maxlength="8" required>

        <button class="btn btn-primary" style="width:100%;margin-top:16px;padding:12px 14px;">
          Find file →
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
