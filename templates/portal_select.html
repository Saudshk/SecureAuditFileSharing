{% extends "base.html" %}
{% block content %}
<div class="section" style="max-width:720px;margin:0 auto;">
  <h2 style="margin:0 0 8px;">Welcome, {{ company }}</h2>
  <div class="small-muted">Choose a portal to login.</div>

  <div class="glass-card" style="margin-top:18px;">
    <div class="right-pane">
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <a class="btn btn-primary" href="{{ url_for('employee_login', role='admin') }}">Admin Portal</a>
        <a class="btn" href="{{ url_for('employee_login', role='it') }}">IT Portal</a>
        <a class="btn" href="{{ url_for('employee_login', role='staff') }}">Staff Portal</a>
      </div>

      <div style="margin-top:14px;">
        <a class="btn btn-danger" href="{{ url_for('logout') }}">Logout</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
